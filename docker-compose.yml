services:
  postgres:
    image: postgres:16-alpine
    container_name: moto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moto}
      POSTGRES_USER: ${POSTGRES_USER:-moto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moto-local-password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-moto} -d ${POSTGRES_DB:-moto}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
