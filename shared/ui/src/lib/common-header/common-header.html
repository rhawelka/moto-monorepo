<ng-container>
  <header class="site-header">
    <div class="site-header__container">
      <a href="/" class="site-header__logo">
        <span class="site-header__logo-mark" aria-hidden="true">M</span>
        <span class="site-header__logo-name">Moto</span>
      </a>

      <div class="site-header__actions" aria-label="Header actions">
        <button
          mat-icon-button
          type="button"
          aria-label="Notifications"
          (click)="logHeaderAction('notifications')"
        >
          <mat-icon>notifications_none</mat-icon>
        </button>
        <button
          mat-icon-button
          type="button"
          aria-label="Help"
          (click)="logHeaderAction('help')"
        >
          <mat-icon>help_outline</mat-icon>
        </button>
        <button
          type="button"
          class="site-header__avatar"
          aria-label="User profile"
          (click)="logHeaderAction('profile')"
        >
          JD
        </button>
      </div>
    </div>
  </header>
</ng-container>
