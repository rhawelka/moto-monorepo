<mat-sidenav-container
  class="ui-sidebar-shell"
  [class.ui-sidebar-shell--collapsed]="!expanded"
>
  <mat-sidenav
    mode="side"
    opened
    class="ui-sidebar"
    [class.ui-sidebar--collapsed]="!expanded"
  >
    <mat-toolbar class="ui-sidebar__toolbar">
      <span class="ui-sidebar__brand-mark" aria-hidden="true">M</span>
      @if (expanded) {
      <span class="ui-sidebar__brand-name">Moto</span>
      }
    </mat-toolbar>

    <div class="ui-sidebar__section-label">Workspace</div>
    <mat-nav-list aria-label="Workspace navigation">
      @for (item of navItems; track item.route + item.label) {
      <a mat-list-item [routerLink]="item.route" routerLinkActive="active-link">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
      }
    </mat-nav-list>

    <div class="ui-sidebar__footer">
      <button
        type="button"
        class="ui-sidebar__toggle"
        [attr.aria-label]="expanded ? 'Collapse navigation' : 'Expand navigation'"
        (click)="toggle()"
      >
        <mat-icon>
          {{ expanded ? 'keyboard_arrow_left' : 'keyboard_arrow_right' }}
        </mat-icon>
        @if (expanded) {
        <span class="ui-sidebar__toggle-label">Collapse</span>
        }
      </button>
      <button
        mat-raised-button
        color="warn"
        type="button"
        class="ui-sidebar__logout"
        (click)="logout()"
      >
        <mat-icon>logout</mat-icon>
        <span class="ui-sidebar__logout-label">Log out</span>
      </button>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <ng-content></ng-content>
  </mat-sidenav-content>
</mat-sidenav-container>
